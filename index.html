<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Side Scoop - Market Intel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@400;700;900&display=swap');
        body { font-family: 'M PLUS 1', sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Destructure hooks from React
        const { useState, useEffect } = React;

        // Create Lucide Icon Component to work with the CDN
        const Icon = ({ name, className }) => {
            const [iconHtml, setIconHtml] = React.useState('');
            React.useEffect(() => {
                const icon = lucide.icons[name];
                if (icon) {
                    const svg = lucide.createIcons({
                        icons: { [name]: icon },
                        attrs: { class: className }
                    });
                }
            }, [name, className]);
            
            // Fallback since lucide.createIcons handles DOM directly
            // We'll use a safer approach for React
            const LucideIcon = ({ iconName, ...props }) => {
                const IconComponent = () => {
                    const svgString = lucide.icons[iconName];
                    return <span dangerouslySetInnerHTML={{ __html: svgString }} />;
                };
            };
        };

        // Standard Lucide icons often need a wrapper for React CDN usage
        // To ensure 100% reliability in a single HTML file, we use inline SVGs 
        // for the core elements that match the original look.

        const SideScoopTracker = () => {

            const colors = {

                primary: '#C58662',
                secondary: '#FFF8F8',
                tertiary: '#8EA77A',
                black: '#1A1A1A',

                { id: 5, name: "Notary Public (Remote)", volume: "Stable", trend: "Steady", sentiment: "Neutral", difficulty: "Medium", timeToPay: "1 Month", risk: "Low", description: "Digitally notarizing legal documents. Stable, government-regulated income with low volatility." }
            ];

            const movers = [
                { id: 11, name: "AI Voice Cloning Agency", change: "+142%", type: "New Entry", difficulty: "High", timeToPay: "2 Weeks", risk: "High", description: "Using ElevenLabs or similar to clone founder voices for localized global content." },
                { id: 12, name: "Domain Flipping (AI TLDs)", change: "+89%", type: "Return", difficulty: "Low", timeToPay: "Instant", risk: "Very High", description: "Speculating on .ai and .io domains." }
            ];

            const marketData = {

                        news: "Enterprise-grade 'Context Design' is replacing simple chatbots.",
                        instaHook: "AI Agents > Chatbots. Businesses pay $5k/mo to automate tasks. 🤖",

                    },

                        roi: "35%",

                        risk: "Low",
                        description: "Luxury protection for vehicles with high profit margins."
                    }

                    { 
                        id: 23, 
                        title: "Traditional Dropshipping", 
                        ticker: "DROP",

                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                            <div className="lg:col-span-3 space-y-8">
                                <div className="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100">
                                    <h3 className="text-xs font-black text-slate-400 uppercase mb-4">Watch List</h3>
                                    {watchList.map(item => (
                                        <div key={item.id} className="flex justify-between py-2 cursor-pointer hover:text-[#C58662]" onClick={() => setSelectedItem(item)}>
                                            <span className="text-xs font-bold">{item.name}</span>
                                            <span className="text-[10px] font-black uppercase text-green-600">{item.sentiment}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="lg:col-span-6 space-y-6">
                                {marketData[activeTab].map(item => (
                                    <div key={item.id} className="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100 cursor-pointer hover:border-[#C58662] transition-all" onClick={() => setSelectedItem(item)}>
                                        <div className="flex justify-between items-center mb-4">
                                            <span className="text-[#C58662] font-black text-xl">{item.ticker}</span>
                                            <span className="text-lg font-black text-[#8EA77A]">{item.roi} ROI</span>
                                        </div>
                                        <h2 className="text-2xl font-black mb-2">{item.title}</h2>
                                        <p className="text-sm text-slate-500 mb-4">{item.news}</p>
                                        <span className="text-[10px] font-black uppercase text-[#C58662]">View Analysis →</span>
                                    </div>
                                ))}
                            </div>

                            <div className="lg:col-span-3">
                                <div className="bg-[#1A1A1A] text-white p-8 rounded-[2.5rem] h-full">
                                    <h3 className="text-amber-400 font-black text-xs uppercase mb-6">Market Pulse</h3>
                                    {marketData.newsFlash.map(news => (
                                        <div key={news.id} className="mb-6 pb-6 border-b border-white/10 cursor-pointer" onClick={() => setSelectedItem(news)}>
                                            <span className="text-[10px] text-slate-400 uppercase">{news.type}</span>
                                            <h4 className="font-bold text-sm">{news.title}</h4>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

            );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SideScoopTracker />);
    </script>
</body>
</html>
