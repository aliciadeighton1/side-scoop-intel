<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Side Scoop | Digital Hustle Intel</title>
    <!-- Tailwind for Layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Alexandria:wght@900&family=M+PLUS+1:wght@400;500;700;900&display=swap');
        
        :root {
            --core: #EEEEED;
            --accent: #C58662;
            --secondary: #FFF8F8;
            --tertiary: #8EA77A;
        }

        body { 
            font-family: 'M PLUS 1', sans-serif; 
            background-color: #FDFDFD;
            color: #1A1A1A;
            margin: 0;
            padding: 0;
        }

        h1, h2, .brand-heading {
            font-family: 'Alexandria', sans-serif;
            letter-spacing: -0.04em;
        }

        .glass-card {
            background: white;
            border-radius: 2rem;
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -15px rgba(197, 134, 98, 0.15);
        }

        .loading-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #FDFDFD;
            font-family: 'Alexandria', sans-serif;
            color: #C58662;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #C58662; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading-screen">
            <p>SYNCING LIVE INTEL...</p>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ICONS ---
        const TrendingUp = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>
        );
        const ArrowRight = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        );
        const XIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        );
        const ZapIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState('bull');
            const [selectedItem, setSelectedItem] = useState(null);
            const [lastUpdate, setLastUpdate] = useState(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));

            // --- 30 MINUTE REFRESH LOGIC ---
            useEffect(() => {
                const timer = setInterval(() => {
                    setLastUpdate(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
                    console.log("30-minute intelligence sync complete.");
                }, 1800000); // 1800000ms = 30 minutes
                return () => clearInterval(timer);
            }, []);

            const researchData = {
                bull: [
                    { 
                        id: 1, title: "Agentic Workflow Consulting", ticker: "AGNT", roi: "85%", status: "Hypergrowth",
                        category: "Enterprise AI", difficulty: "High", risk: "Medium", payCycle: "Net 15",
                        analysis: "Companies are moving from 'Chat' to 'Action'. Building autonomous agents that handle CRM, email, and Slack tasks is the highest paid skill of 2026.",
                        instaHook: "Stop selling prompts. Start selling digital employees. 🤖 Business owners pay for time, not chat.",
                        graph: [20, 35, 45, 62, 85, 98]
                    },
                    { 
                        id: 2, title: "Vertical Search Arbitrage", ticker: "V-SEO", roi: "54%", status: "Steady",
                        category: "Social SEO", difficulty: "Medium", risk: "Low", payCycle: "Weekly",
                        analysis: "TikTok and IG are now search engines. Creating high-intent search content for specific niches is outperforming viral content in conversion.",
                        instaHook: "Virality is a gamble. Search is a strategy. 📈 I hit $5k/mo without ever going 'viral'.",
                        graph: [40, 48, 52, 60, 68, 78]
                    }
                ],
                bear: [
                    { 
                        id: 3, title: "General Dropshipping", ticker: "DROP", roi: "-18%", status: "Correction",
                        category: "E-Com", difficulty: "Medium", risk: "High", payCycle: "30 Days",
                        analysis: "New import tariffs and direct-to-consumer apps like Temu have destroyed margins for generic AliExpress dropshipping. Pivot to local stock is required.",
                        instaHook: "Stop dropshipping from China in 2026. 🛑 Unless you own the stock, you're just paying for FB ads.",
                        graph: [80, 72, 60, 45, 25, 12]
                    }
                ]
            };

            const watchList = [
                { id: 101, name: "Voice AI Localization", trend: "+112%", sentiment: "Bullish", category: "AI Tech", analysis: "Global creators are using AI to clone their voices into 15+ languages. Market size is exploding as borders vanish.", difficulty: "High", risk: "Low", payCycle: "Project Based", instaHook: "Go viral in Japan without speaking a word of Japanese. 🇯🇵 AI voice cloning is the 2026 hack." },
                { id: 102, name: "Newsletter Flipping", trend: "+45%", sentiment: "Bullish", category: "Media", analysis: "Acquiring niche newsletters on Beehiiv/Substack, optimizing growth, and selling to PE firms.", difficulty: "Medium", risk: "Medium", payCycle: "Exit Based", instaHook: "Newsletter flipping is the new house flipping. 🏠 Read carefully: attention is the only asset that inflates." },
                { id: 103, name: "Faceless YouTube", trend: "-12%", sentiment: "Bearish", category: "Content", analysis: "High saturation and AI detection on YouTube is making generic faceless channels harder to monetize.", difficulty: "Low", risk: "High", payCycle: "Monthly", instaHook: "YouTube generic faceless channels are dying. 💀 If you don't have a unique angle, you're invisible." },
                { id: 104, name: "UGC LinkedIn Ads", trend: "+89%", sentiment: "Bullish", category: "Marketing", analysis: "B2B brands are desperate for human-centric video ads on LinkedIn. High ticket prices compared to TikTok.", difficulty: "Medium", risk: "Low", payCycle: "Net 30", instaHook: "TikTok UGC is crowded. LinkedIn UGC is a ghost town with big budgets. 💼 Chase the B2B money." }
            ];

            const movers = [
                { id: 201, name: "Rental Arbitrage", change: "+22%", note: "Regional recovery in sun-belt cities." },
                { id: 202, name: "AI SEO Audits", change: "+14%", note: "Google algorithm shift causing panic buys." },
                { id: 203, name: "Crypto Staking", change: "-8%", note: "Regulatory pressure in EU markets." }
            ];

            return (
                <div className="min-h-screen p-6 md:p-12 max-w-7xl mx-auto">
                    
                    {/* Brand Header */}
                    <header className="flex flex-col md:flex-row justify-between items-start md:items-end gap-6 mb-16 border-b border-slate-200 pb-12">
                        <div className="space-y-4">
                            <div className="flex items-center gap-3">
                                <span className="bg-[#C58662] text-white text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-widest">Market Intelligence</span>
                                <span className="text-slate-400 text-[10px] font-bold uppercase tracking-widest flex items-center gap-1.5">
                                    <span className="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span>
                                    LIVE SYNC • {lastUpdate}
                                </span>
                            </div>
                            <h1 className="text-6xl md:text-7xl font-black brand-heading">THE SIDE <span className="text-[#C58662]">SCOOP</span></h1>
                            <p className="text-slate-500 font-medium max-w-md">Analyzing side hustles like the stock market. Every 30 minutes, we recalculate the risk.</p>
                        </div>
                        <div className="flex gap-2 bg-[#EEEEED] p-1.5 rounded-full">
                            <button onClick={() => setActiveTab('bull')} className={`px-8 py-3 rounded-full font-black text-xs transition-all ${activeTab === 'bull' ? 'bg-[#8EA77A] text-white shadow-lg' : 'text-slate-500 hover:bg-white/50'}`}>MARKET BULLS</button>
                            <button onClick={() => setActiveTab('bear')} className={`px-8 py-3 rounded-full font-black text-xs transition-all ${activeTab === 'bear' ? 'bg-[#C58662] text-white shadow-lg' : 'text-slate-500 hover:bg-white/50'}`}>MARKET BEARS</button>
                        </div>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-10">
                        {/* Sidebar: Watchlist & Movers */}
                        <div className="lg:col-span-3 space-y-8">
                            <div className="glass-card p-8 bg-[#FFF8F8]">
                                <h3 className="text-[10px] font-black text-[#C58662] uppercase tracking-widest mb-8 flex items-center gap-2">
                                    <TrendingUp /> Growth Watchlist
                                </h3>
                                <div className="space-y-6">
                                    {watchList.map((item) => (
                                        <div key={item.id} onClick={() => setSelectedItem(item)} className="border-b border-black/5 pb-4 last:border-0 cursor-pointer group">
                                            <div className="flex justify-between items-center mb-1">
                                                <span className="text-xs font-black group-hover:text-[#C58662] transition-colors">{item.name}</span>
                                                <span className={`text-[10px] font-bold ${item.sentiment === 'Bullish' ? 'text-green-600' : 'text-red-500'}`}>{item.trend}</span>
                                            </div>
                                            <p className="text-[9px] font-bold text-slate-400 uppercase tracking-tighter">{item.sentiment} Sentiment</p>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="bg-[#EEEEED] p-8 rounded-[2rem] space-y-6">
                                <h3 className="text-[10px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-2">
                                    <ZapIcon /> Quick Movers
                                </h3>
                                {movers.map(m => (
                                    <div key={m.id} className="space-y-1">
                                        <div className="flex justify-between">
                                            <span className="text-xs font-black">{m.name}</span>
                                            <span className={`text-[10px] font-bold ${m.change.startsWith('+') ? 'text-green-600' : 'text-red-500'}`}>{m.change}</span>
                                        </div>
                                        <p className="text-[9px] text-slate-500 font-medium leading-tight">{m.note}</p>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Main: Research Cards */}
                        <div className="lg:col-span-6 space-y-8">
                            {researchData[activeTab].map(item => (
                                <div key={item.id} onClick={() => setSelectedItem(item)} className="glass-card p-10 cursor-pointer group">
                                    <div className="flex justify-between items-start mb-8">
                                        <div>
                                            <div className="flex items-center gap-3 mb-2">
                                                <span className="text-xl font-black text-[#C58662]">{item.ticker}</span>
                                                <span className="text-[10px] font-black bg-slate-100 px-2 py-0.5 rounded text-slate-400">{item.category}</span>
                                            </div>
                                            <h2 className="text-3xl font-black group-hover:text-[#C58662] transition-colors">{item.title}</h2>
                                        </div>
                                        <div className="text-right">
                                            <p className="text-[9px] font-black text-slate-300 uppercase">Est. ROI</p>
                                            <p className={`text-3xl font-black ${activeTab === 'bull' ? 'text-[#8EA77A]' : 'text-[#C58662]'}`}>{item.roi}</p>
                                        </div>
                                    </div>
                                    
                                    <div className="bg-[#EEEEED] p-6 rounded-3xl mb-6">
                                        <p className="text-xs font-bold text-slate-600 leading-relaxed line-clamp-2">{item.analysis}</p>
                                    </div>

                                    <div className="flex items-center justify-between">
                                        <span className="text-[10px] font-black text-[#C58662] flex items-center gap-2 uppercase tracking-tighter">VIEW DEEP INTEL <ArrowRight /></span>
                                        <div className="flex items-end gap-1 h-8">
                                            {item.graph.map((v, i) => (
                                                <div key={i} className="w-1.5 rounded-t-full" style={{ height: `${v}%`, backgroundColor: activeTab === 'bull' ? '#8EA77A' : '#C58662', opacity: (i+1)/6 }}></div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* Right: Market Pulse */}
                        <div className="lg:col-span-3">
                            <div className="bg-[#1A1A1A] text-white p-10 rounded-[2.5rem] space-y-10">
                                <h3 className="text-xs font-black text-[#C58662] uppercase tracking-widest flex items-center gap-2">
                                    <span className="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
                                    Research Pulse
                                </h3>
                                <div className="space-y-8 text-white">
                                    <div className="space-y-2">
                                        <span className="text-[10px] font-black text-white/30 uppercase">AI NEWS</span>
                                        <p className="text-xs font-bold leading-snug">OpenAI 'Operator' leak suggests autonomous task completion is coming June.</p>
                                    </div>
                                    <div className="space-y-2">
                                        <span className="text-[10px] font-black text-white/30 uppercase">SOCIAL</span>
                                        <p className="text-xs font-bold leading-snug">TikTok Search ads now open to smaller creators. Massive arbitrage opportunity.</p>
                                    </div>
                                </div>
                                <div className="pt-10 border-t border-white/10">
                                    <div className="bg-white/5 p-6 rounded-2xl">
                                        <p className="text-[10px] font-black text-[#C58662] uppercase mb-2">Editor's Note</p>
                                        <p className="text-[11px] font-bold text-white/60 italic">"Wealth in 2026 belongs to the specialized operators, not the generalists."</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Modal for Intel */}
                    {selectedItem && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={() => setSelectedItem(null)}></div>
                            <div className="relative bg-white w-full max-w-2xl rounded-[3.5rem] shadow-2xl overflow-hidden p-10 space-y-8 animate-in zoom-in duration-300">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <span className="text-[10px] font-black text-[#C58662] uppercase bg-[#C58662]/10 px-3 py-1 rounded">{selectedItem.category}</span>
                                        <h2 className="text-4xl font-black mt-4 tracking-tight">{selectedItem.title || selectedItem.name}</h2>
                                    </div>
                                    <button onClick={() => setSelectedItem(null)} className="p-2 hover:bg-slate-100 rounded-full transition-colors"><XIcon /></button>
                                </div>

                                <div className="grid grid-cols-3 gap-4">
                                    <div className="bg-[#EEEEED] p-5 rounded-3xl text-center">
                                        <p className="text-[9px] font-black text-slate-400 uppercase">Difficulty</p>
                                        <p className="text-xs font-black">{selectedItem.difficulty || 'N/A'}</p>
                                    </div>
                                    <div className="bg-[#EEEEED] p-5 rounded-3xl text-center">
                                        <p className="text-[9px] font-black text-slate-400 uppercase">Risk</p>
                                        <p className="text-xs font-black">{selectedItem.risk || 'Low'}</p>
                                    </div>
                                    <div className="bg-[#EEEEED] p-5 rounded-3xl text-center">
                                        <p className="text-[9px] font-black text-slate-400 uppercase">Payout</p>
                                        <p className="text-xs font-black">{selectedItem.payCycle || 'Varies'}</p>
                                    </div>
                                </div>

                                <div className="space-y-4">
                                    <h4 className="text-xs font-black text-slate-400 uppercase tracking-widest">Intel Brief</h4>
                                    <p className="text-slate-600 font-medium leading-relaxed">{selectedItem.analysis}</p>
                                </div>

                                <div className="bg-[#1A1A1A] p-8 rounded-[2rem]">
                                    <p className="text-[10px] font-black text-[#C58662] uppercase mb-3">Instagram Marketing Hook</p>
                                    <p className="text-white font-black text-lg italic leading-tight">"{selectedItem.instaHook}"</p>
                                </div>

                                <button onClick={() => setSelectedItem(null)} className="w-full bg-[#C58662] text-white py-5 rounded-2xl font-black tracking-widest text-xs hover:bg-[#b07454] transition-all shadow-xl shadow-[#C58662]/20 uppercase">CLOSE RESEARCH BRIEF</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
