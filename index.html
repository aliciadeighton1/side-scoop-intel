<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Side Scoop | Digital Hustle Intel</title>
    <!-- Tailwind for Layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel (Enables the interactive dashboard in a standard HTML file) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Alexandria:wght@900&family=M+PLUS+1:wght@400;500;700;900&display=swap');
        
        :root {
            --core: #EEEEED;
            --accent: #C58662;
            --secondary: #FFF8F8;
            --tertiary: #8EA77A;
        }

        body { 
            font-family: 'M PLUS 1', sans-serif; 
            background-color: #FDFDFD;
            color: #1A1A1A;
        }

        h1, h2, .brand-heading {
            font-family: 'Alexandria', sans-serif;
            letter-spacing: -0.04em;
        }

        .glass-card {
            background: white;
            border-radius: 2rem;
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -15px rgba(197, 134, 98, 0.15);
        }

        /* Custom scrollbar for a slicker look */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #C58662; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Custom Icon Component to work with Lucide in this environment
        const Icon = ({ name, size = 20, className = "" }) => {
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('bull');
            const [selectedItem, setSelectedItem] = useState(null);

            useEffect(() => {
                // Initialize icons after React renders
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [activeTab, selectedItem]);

            const researchData = {
                bull: [
                    { 
                        id: 1, title: "Agentic Workflow Consulting", ticker: "AGNT", roi: "85%", status: "Hypergrowth",
                        category: "Enterprise AI", difficulty: "High", risk: "Medium", payCycle: "Net 15",
                        analysis: "Companies are moving from 'Chat' to 'Action'. Building autonomous agents that handle CRM, email, and Slack tasks is the highest paid skill of 2026.",
                        instaHook: "Stop selling prompts. Start selling digital employees. 🤖 Business owners pay for time, not chat.",
                        graph: [20, 35, 45, 62, 85, 98]
                    },
                    { 
                        id: 2, title: "Vertical Search Arbitrage", ticker: "V-SEO", roi: "54%", status: "Steady",
                        category: "Social SEO", difficulty: "Medium", risk: "Low", payCycle: "Weekly",
                        analysis: "TikTok and IG are now search engines. Creating high-intent search content for specific niches is outperforming viral content in conversion.",
                        instaHook: "Virality is a gamble. Search is a strategy. 📈 I hit $5k/mo without ever going 'viral'.",
                        graph: [40, 48, 52, 60, 68, 78]
                    }
                ],
                bear: [
                    { 
                        id: 3, title: "General Dropshipping", ticker: "DROP", roi: "-18%", status: "Correction",
                        category: "E-Com", difficulty: "Medium", risk: "High", payCycle: "30 Days",
                        analysis: "New import tariffs and direct-to-consumer apps like Temu have destroyed margins for generic AliExpress dropshipping. Pivot to local stock is required.",
                        instaHook: "Stop dropshipping from China in 2026. 🛑 Unless you own the stock, you're just paying for FB ads.",
                        graph: [80, 72, 60, 45, 25, 12]
                    }
                ]
            };

            const watchList = [
                { name: "Voice AI Localization", trend: "+112%", sentiment: "Bullish" },
                { name: "Newsletter Flipping", trend: "+45%", sentiment: "Bullish" },
                { name: "Faceless YouTube", trend: "-12%", sentiment: "Bearish" },
                { name: "UGC LinkedIn Ads", trend: "+89%", sentiment: "Bullish" }
            ];

            return (
                <div className="min-h-screen p-6 md:p-12 max-w-7xl mx-auto">
                    
                    {/* Brand Header */}
                    <header className="flex flex-col md:flex-row justify-between items-start md:items-end gap-6 mb-16 border-b border-slate-200 pb-12">
                        <div className="space-y-4">
                            <div className="flex items-center gap-3">
                                <span className="bg-[#C58662] text-white text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-widest">Market Intelligence</span>
                                <span className="text-slate-400 text-[10px] font-bold uppercase tracking-widest">Live Pulse • May 2026</span>
                            </div>
                            <h1 className="text-6xl md:text-7xl font-black brand-heading">THE SIDE <span className="text-[#C58662]">SCOOP</span></h1>
                            <p className="text-slate-500 font-medium max-w-md">Analyzing side hustles like the stock market. Calculated risk, maximum ROI.</p>
                        </div>
                        <div className="flex gap-2 bg-[#EEEEED] p-1.5 rounded-full">
                            <button onClick={() => setActiveTab('bull')} className={`px-8 py-3 rounded-full font-black text-xs transition-all ${activeTab === 'bull' ? 'bg-[#8EA77A] text-white shadow-lg' : 'text-slate-500 hover:bg-white/50'}`}>MARKET BULLS</button>
                            <button onClick={() => setActiveTab('bear')} className={`px-8 py-3 rounded-full font-black text-xs transition-all ${activeTab === 'bear' ? 'bg-[#C58662] text-white shadow-lg' : 'text-slate-500 hover:bg-white/50'}`}>MARKET BEARS</button>
                        </div>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-10">
                        {/* Sidebar: Watchlist */}
                        <div className="lg:col-span-3 space-y-6">
                            <div className="glass-card p-8 bg-[#FFF8F8]">
                                <h3 className="text-[10px] font-black text-[#C58662] uppercase tracking-widest mb-8 flex items-center gap-2">
                                    <Icon name="trending-up" size={14} /> Growth Watchlist
                                </h3>
                                <div className="space-y-6">
                                    {watchList.map((item, i) => (
                                        <div key={i} className="border-b border-black/5 pb-4 last:border-0">
                                            <div className="flex justify-between items-center mb-1">
                                                <span className="text-xs font-black">{item.name}</span>
                                                <span className={`text-[10px] font-bold ${item.sentiment === 'Bullish' ? 'text-green-600' : 'text-red-500'}`}>{item.trend}</span>
                                            </div>
                                            <p className="text-[9px] font-bold text-slate-400 uppercase tracking-tighter">{item.sentiment} Sentiment</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Main: Research Cards */}
                        <div className="lg:col-span-6 space-y-8">
                            {researchData[activeTab].map(item => (
                                <div key={item.id} onClick={() => setSelectedItem(item)} className="glass-card p-10 cursor-pointer group">
                                    <div className="flex justify-between items-start mb-8">
                                        <div>
                                            <div className="flex items-center gap-3 mb-2">
                                                <span className="text-xl font-black text-[#C58662]">{item.ticker}</span>
                                                <span className="text-[10px] font-black bg-slate-100 px-2 py-0.5 rounded text-slate-400">{item.category}</span>
                                            </div>
                                            <h2 className="text-3xl font-black group-hover:text-[#C58662] transition-colors">{item.title}</h2>
                                        </div>
                                        <div className="text-right">
                                            <p className="text-[9px] font-black text-slate-300 uppercase">Est. ROI</p>
                                            <p className={`text-3xl font-black ${activeTab === 'bull' ? 'text-[#8EA77A]' : 'text-[#C58662]'}`}>{item.roi}</p>
                                        </div>
                                    </div>
                                    
                                    <div className="bg-[#EEEEED] p-6 rounded-3xl mb-6">
                                        <p className="text-xs font-bold text-slate-600 leading-relaxed line-clamp-2">{item.analysis}</p>
                                    </div>

                                    <div className="flex items-center justify-between">
                                        <span className="text-[10px] font-black text-[#C58662] flex items-center gap-2">VIEW DEEP INTEL <Icon name="arrow-right" size={12} /></span>
                                        <div className="flex items-end gap-1 h-8">
                                            {item.graph.map((v, i) => (
                                                <div key={i} className="w-1.5 rounded-t-full" style={{ height: `${v}%`, backgroundColor: activeTab === 'bull' ? '#8EA77A' : '#C58662', opacity: (i+1)/6 }}></div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* Right: Market Pulse */}
                        <div className="lg:col-span-3">
                            <div className="bg-[#1A1A1A] text-white p-10 rounded-[2.5rem] space-y-10">
                                <h3 className="text-xs font-black text-[#C58662] uppercase tracking-widest flex items-center gap-2">
                                    <span className="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
                                    Research Pulse
                                </h3>
                                <div className="space-y-8">
                                    <div className="space-y-2">
                                        <span className="text-[10px] font-black text-white/30 uppercase">AI NEWS</span>
                                        <p className="text-xs font-bold leading-snug">OpenAI 'Operator' leak suggests autonomous task completion is coming June.</p>
                                    </div>
                                    <div className="space-y-2">
                                        <span className="text-[10px] font-black text-white/30 uppercase">SOCIAL</span>
                                        <p className="text-xs font-bold leading-snug">TikTok Search ads now open to smaller creators. Massive arbitrage opportunity.</p>
                                    </div>
                                </div>
                                <div className="pt-10 border-t border-white/10">
                                    <div className="bg-white/5 p-6 rounded-2xl">
                                        <p className="text-[10px] font-black text-[#C58662] uppercase mb-2">Editor's Note</p>
                                        <p className="text-[11px] font-bold text-white/60 italic">"Wealth in 2026 belongs to the specialized operators, not the generalists."</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Modal for Intel */}
                    {selectedItem && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-black/60 backdrop-blur-md" onClick={() => setSelectedItem(null)}></div>
                            <div className="relative bg-white w-full max-w-2xl rounded-[3rem] shadow-2xl overflow-hidden p-10 space-y-8">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <span className="text-[10px] font-black text-[#C58662] uppercase bg-[#C58662]/10 px-3 py-1 rounded">{selectedItem.category}</span>
                                        <h2 className="text-4xl font-black mt-4">{selectedItem.title}</h2>
                                    </div>
                                    <button onClick={() => setSelectedItem(null)} className="text-slate-300 hover:text-black transition-colors"><Icon name="x" size={32} /></button>
                                </div>

                                <div className="grid grid-cols-3 gap-4">
                                    <div className="bg-[#EEEEED] p-5 rounded-3xl text-center">
                                        <p className="text-[9px] font-black text-slate-400 uppercase">Difficulty</p>
                                        <p className="text-xs font-black">{selectedItem.difficulty}</p>
                                    </div>
                                    <div className="bg-[#EEEEED] p-5 rounded-3xl text-center">
                                        <p className="text-[9px] font-black text-slate-400 uppercase">Risk</p>
                                        <p className="text-xs font-black">{selectedItem.risk}</p>
                                    </div>
                                    <div className="bg-[#EEEEED] p-5 rounded-3xl text-center">
                                        <p className="text-[9px] font-black text-slate-400 uppercase">Payout</p>
                                        <p className="text-xs font-black">{selectedItem.payCycle}</p>
                                    </div>
                                </div>

                                <div className="space-y-4">
                                    <h4 className="text-xs font-black text-slate-400 uppercase tracking-widest">Intel Brief</h4>
                                    <p className="text-slate-600 font-medium leading-relaxed">{selectedItem.analysis}</p>
                                </div>

                                <div className="bg-[#1A1A1A] p-8 rounded-[2rem]">
                                    <p className="text-[10px] font-black text-white/40 uppercase mb-3 flex items-center gap-2"><Icon name="instagram" size={12}/> Marketing Hook</p>
                                    <p className="text-white font-black text-lg italic leading-tight">"{selectedItem.instaHook}"</p>
                                </div>

                                <button onClick={() => setSelectedItem(null)} className="w-full bg-[#C58662] text-white py-5 rounded-2xl font-black tracking-widest text-xs hover:scale-[1.02] active:scale-95 transition-all shadow-xl shadow-[#C58662]/20">CLOSE RESEARCH BRIEF</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
